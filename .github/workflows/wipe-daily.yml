name: Borrar imagenes al final del dia

# Este repo es publico, pero cada workflow ya SOBREESCRIBE el archivo de
# cada ticker en cada corrida (nunca acumula historial) -- asi que borrar a
# medianoche solo dejaba el dashboard autonomo (t0.insidetrades.app) en
# blanco varias horas, hasta la primera publicacion del dia siguiente. Se
# desactivo el cron por eso: ahora las imagenes se quedan como quedaron al
# cierre y se reemplazan solas en la siguiente sesion. Se deja el disparo
# manual por si algun dia se quiere vaciar a mano.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vaciar images/
        run: |
          if [ -d images ] && [ "$(ls -A images 2>/dev/null)" ]; then
            git rm -rq images/*
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Borrado diario de imagenes $(date -u +%F)"
            git push -q
          else
            echo "images/ ya estaba vacia, nada que borrar."
          fi
